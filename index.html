<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video class="background" autoplay muted loop>
        <source src="resource/goku-ultra-instinct_2.1920x1080.mp4" type="video/mp4">
    </video>

    <div class="container">
        <h1>Todo List</h1>
        <div class="stat-Container">
            <div class="details">
                <h3>keep it out!</h3>
                <div id="progressbar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="statnumber">
                    <div id="number">0/0</div>
                </div>
        </div>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">+</button>
        </div>

        <div class="todo-container">
            <h2>Todo</h2>
            <ul id="todoList"></ul>
            <img class="empty-image" src="resource/nada.jpg" alt="Todo Image">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
