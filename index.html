<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo list</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <video class="background" autoplay muted loop playsinline>
        <source id="video-source" src="resource/background.mp4" type="video/mp4">
    </video>
    <div class="menu">
        <a id="menuToggle"><img id="menu-icon" src="resource/menu.png" alt="Menu"></a>
        <div class="menu-item">
            <div class="menu-item" id="new-button">New</div>
            <div class="menu-item">
                <input id="selector-video" type="file" class="hidden" accept="video/*">
                <label for="selector-video">Cambiar fondo</label>
            </div>
            <div class="menu-item" id="save-button">guardar</div>
            <div class="menu-item" id="load-button">cargar</div>
        </div>
        <p class="copyright">Pagina hecha por <a href="https://github.com/yourusername" target="_blank">Bryan Camilo Peláez Jiménez</a></p>
    </div>
    <div class="container">
        <h1>Todo List</h1>
        <div class="stat-Container">
            <div class="details">
                <h3>keep it out!</h3>
                <div id="progressbar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="statnumber">
                    <div id="number">0/0</div>
                </div>
        </div>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">+</button>
        </div>

        <div class="todo-container">
            <ul id="todoList"></ul>
            <img class="empty-image" src="resource/nada.png" alt="Todo Image">
        </div>
    </div>

    <script src="script.js"></script>
    
    

</body>
</html>
