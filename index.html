<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo list</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <video class="background" autoplay muted loop playsinline>
        <source id="video-source" src="resource/fondo.mp4" type="video/mp4">
    </video>
    <div class="menu">
        <a id="menuToggle">
        <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        aria-hidden="true"
        >
            <path id="menu-icon" d="M3 6h18M3 12h18M3 18h18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"/>
        </svg>
    </svg></a>
        <div class="menu-item-container">
            <div class="menu-item" id="new-button">New</div>
            <div class="menu-item">
                <input id="selector-video" type="file" class="hidden" accept="video/*">
                <label for="selector-video" class="bg-label">background</label>
            </div>
            <div class="menu-item" id="save-button">save</div>
            <div class="menu-item" id="load-button">load</div>
        </div>
        <p class="copyright" style="display:none;">Pagina hecha por <a href="https://github.com/BryanCPl" target="_blank">Bryan Camilo Peláez Jiménez</a></p>
    </div>
    <div class="container">
        <h1>Todo List</h1>
        <div class="stat-Container">
            <div class="details">
                <div id="progressbar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="statnumber">
                    <div id="number">0/0</div>
                </div>
        </div>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">+</button>
        </div>

        <div class="todo-container">
            <ul id="todoList"></ul>
            <img class="empty-image" src="resource/nada.png" alt="Todo Image">
        </div>
        <button id="delete-all-Btn" class="hidden">Delete All</button>
    </div>

    <script src="confetti.js"></script>
    <script src="script.js"></script>
    
    

</body>
</html>
